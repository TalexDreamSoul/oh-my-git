name: Build and Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_NAME: oh-my-git
  GODOT_VERSION: 3.2.3

jobs:
  build:
    name: Build Windows and macOS packages
    runs-on: ubuntu-20.04
    container:
      image: barichello/godot-ci:3.2.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make wget zip p7zip p7zip-full

      - name: Setup Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/templates
          mv "/root/.local/share/godot/templates/${GODOT_VERSION}.stable" \
             "$HOME/.local/share/godot/templates/${GODOT_VERSION}.stable"

      - name: Build macOS
        run: make macos

      - name: Build Windows
        run: make windows

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-windows-macos
          path: |
            build/${{ env.PROJECT_NAME }}-macos.zip
            build/${{ env.PROJECT_NAME }}-windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/${{ env.PROJECT_NAME }}-macos.zip
            build/${{ env.PROJECT_NAME }}-windows.zip
          generate_release_notes: true
